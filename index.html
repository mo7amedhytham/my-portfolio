<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تواصل مع محمد هيثم</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --container-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .contact-card {
            background-color: var(--container-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
        }
        .contact-card h2 {
            margin-top: 0;
            font-size: 24px;
        }
        .contact-card p {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 20px;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: white;
            box-sizing: border-box;
            font-family: inherit;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        button:hover {
            background-color: var(--accent-hover);
        }
        button:disabled {
            background-color: #475569;
            cursor: not-allowed;
        }
        #statusMessage {
            margin-top: 15px;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="contact-card">
        <h2>وظفني في مشروعك 🚀</h2>
        <p>اكتب فكرتك أو طلبك ببساطة، وسيقوم المساعد الذكي الخاص بي بصياغتها كرسالة عمل رسمية وإرسالها لي فوراً!</p>
        
        <form id="contactForm">
            <input type="text" id="senderName" placeholder="اسمك الكريم" required>
            <input type="email" id="senderEmail" placeholder="بريدك الإلكتروني" required>
            <textarea id="rawMessage" rows="4" placeholder="اكتب رسالتك بعفوية هنا... (مثال: عاوزك تعملي ويب سايت شبه كذا)" required></textarea>
            
            <button type="submit" id="submitBtn">
                ✨ صِغها رسمياً وأرسلها
            </button>
        </form>

        <div id="statusMessage"></div>
    </div>

    <script>
        document.getElementById('contactForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('senderName').value;
            const email = document.getElementById('senderEmail').value;
            const rawMessage = document.getElementById('rawMessage').value;
            const submitBtn = document.getElementById('submitBtn');
            const statusMessage = document.getElementById('statusMessage');

            // تغيير حالة الزر أثناء الإرسال
            submitBtn.disabled = true;
            submitBtn.innerHTML = '🤖 جاري الصياغة والإرسال...';
            statusMessage.textContent = '';
            statusMessage.style.color = 'var(--text-muted)';

            try {
                const response = await fetch('http://localhost:3000/api/contact', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, rawMessage })
                });

                const data = await response.json();

                if (response.ok) {
                    statusMessage.textContent = '✅ ' + data.success;
                    statusMessage.style.color = '#4ade80';
                    document.getElementById('contactForm').reset();
                } else {
                    statusMessage.textContent = '❌ ' + data.error;
                    statusMessage.style.color = '#f87171';
                }
            } catch (error) {
                statusMessage.textContent = '❌ حدث خطأ في الاتصال بالسيرفر.';
                statusMessage.style.color = '#f87171';
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '✨ صِغها رسمياً وأرسلها';
            }
        });
    </script>
</body>
</html>
